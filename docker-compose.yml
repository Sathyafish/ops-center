services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme-neo4j}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme-neo4j}
      CHROMA_PERSIST_DIR: /data/chroma
      RUNBOOKS_DIR: /data/runbooks
      ANONYMIZED_TELEMETRY: "FALSE"
      # LLM / Ollama: set in backend/.env only (do not override here — compose ${VAR:-openai} wins over env_file)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - chroma_data:/data/chroma
    depends_on:
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  neo4j_data:
  chroma_data:
